name: market-scan

# Weekly market-wide idea scan: every NYSE/Nasdaq US-GAAP filer from SEC
# XBRL data, priced with dated Yahoo daily closes. On main it commits
# market-scan/latest.json and republishes the Pages site. On pull requests it
# runs the same live scan read-only and uploads the result as an artifact, so
# a change to the scan logic meets real data before it reaches main.
#
# SEC fair access needs a declared User-Agent with a contact address. The
# default is the repository bot's noreply address; set the repository
# variable SEC_USER_AGENT to use another one.

on:
  schedule:
    - cron: '23 6 * * 6'        # Saturdays 06:23 UTC, after Friday's close
  workflow_dispatch:
  pull_request:
    paths:
      - 'market_universe.py'
      - '.github/workflows/market-scan.yml'

permissions:
  contents: write               # commit market-scan/latest.json on main
  actions: write                # dispatch the Pages republish (GITHUB_TOKEN pushes trigger nothing)

concurrency:
  group: market-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements-research.txt

      - name: Offline contract tests
        run: python -m unittest test_market_universe test_market_scanner -v

      - name: Scan the market
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python market_universe.py --output market-scan

      - name: Keep the result for review
        uses: actions/upload-artifact@v5
        with:
          name: market-scan
          path: market-scan/latest.json
          retention-days: 14

      - name: Commit the scan
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "investorace-bot"
          git config user.email "investorace-bot@users.noreply.github.com"
          git add market-scan/latest.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "market-scan: $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Republish the site
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run research-pages.yml --ref main
