name: Deploy Scoreboard

on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:
    inputs:
      new_ticker:
        description: 'Neuer Ticker (z.B. AAPL)'
        required: false
        type: string
      fcf:
        description: 'Free Cash Flow (in Millionen)'
        required: false
        type: string
      shares:
        description: 'Aktienanzahl (in Millionen)'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Add New Ticker (if provided)
        if: ${{ github.event.inputs.new_ticker != '' }}
        run: |
          python add_ticker.py "${{ github.event.inputs.new_ticker }}" "${{ github.event.inputs.fcf }}" "${{ github.event.inputs.shares }}"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add build_scoreboard.py
          git commit -m "Add ticker ${{ github.event.inputs.new_ticker }}"
          git push

      - name: Build HTML
        run: python build_scoreboard.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

