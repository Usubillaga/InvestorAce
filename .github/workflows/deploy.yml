name: build-and-deploy

# Node 24 became the forced default on 2026-06-02; Node 20 is REMOVED from
# runners on 2026-09-16. Every action below is pinned to the major whose
# action.yml declares `using: node24`, so nothing runs on a compatibility shim.
#
# The non-obvious one is upload-pages-artifact. The deprecation annotation
# names actions/upload-artifact -- the INNER action it calls -- not the outer
# one. upload-pages-artifact@v4 still pins upload-artifact 4.6.2, which is
# node20, so bumping v3 -> v4 looks like it should clear the warning and does
# not. Only v5 carries a node24 build.

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'regime_contract.json'
      - 'monitoring_status.json'
      - 'source_reviews.json'
      - 'enagas_review.json'
      - 'assessment_reviews.json'
      - 'assessment_view.js'
      - 'scanner*'
      - 'compare*'
      - 'comparison/**'
      - 'requirements*.txt'
      - 'tests/**'
      - '.github/workflows/*.yml'
  schedule:
    - cron: '0 23 * * 1-5'      # 23:00 UTC, weekdays
  workflow_dispatch:

permissions:
  contents: write               # needed to commit history/
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false     # never cancel a run mid-commit

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Build and publish a consistent generation
        # PR merges and other writers can advance main despite the Pages lock.
        # Retry with a fresh validated build, never a rebase of stale output.
        run: python publish_build.py --output public --attempts 3

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
