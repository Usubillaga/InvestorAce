name: paper-order

# Records one paper order for trade.html. The order is only written down here;
# its fill is replayed later from committed closes (active_trading.py). Paper
# only: no broker is connected and nothing is sent to a market.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# No concurrency group: GitHub keeps only one pending run per group and cancels
# the others, which dropped two of four orders placed together on 2026-11-12.
# Parallel runs are safe: each one re-records its order on the latest main before pushing.

jobs:
  record:
    if: >
      startsWith(github.event.issue.title, 'paper-order:') &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -r requirements-research.txt

      - name: Record and commit order
        id: order
        # The issue title is untrusted text: passed via env, parsed by a strict regex.
        # Parallel orders each append to the same file, so on a push conflict the run
        # resets to the new main and records the order again (intake is idempotent).
        env:
          ORDER_TITLE: ${{ github.event.issue.title }}
          ORDER_BODY: ${{ github.event.issue.body }}
          ORDER_ISSUE: ${{ github.event.issue.number }}
          ORDER_CREATED_AT: ${{ github.event.issue.created_at }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name  "investorace-bot"
          git config user.email "investorace-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            result="$(GITHUB_OUTPUT= python active_trading.py intake | tail -n 1)"
            echo "$result"
            case "$result" in
              ACCEPTED:*)
                git add paper_trades/active-account.json
                git commit -q -m "paper order #$ORDER_ISSUE"
                if git push -q origin "HEAD:$BRANCH"; then
                  { echo "accepted=true"; echo "message=${result#ACCEPTED: }"; } >> "$GITHUB_OUTPUT"
                  exit 0
                fi ;;
              *)
                { echo "accepted=false"; echo "message=${result#REJECTED: }"; } >> "$GITHUB_OUTPUT"
                exit 0 ;;
            esac
            sleep $((attempt * 3))
          done
          echo "accepted=false" >> "$GITHUB_OUTPUT"
          echo "message=could not push the order after 8 attempts; place it again" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Reply and close
        if: always() && steps.order.outcome != 'skipped'
        uses: actions/github-script@v8
        env:
          ACCEPTED: ${{ steps.order.outputs.accepted }}
          MESSAGE: ${{ steps.order.outputs.message }}
        with:
          script: |
            const accepted = process.env.ACCEPTED === 'true';
            const message = process.env.MESSAGE || 'The order could not be recorded; see the workflow log.';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: (accepted ? '✅ ' : '❌ ') + message +
                '\n\nPaper trading only. The account is shown on trade.html after the next nightly build.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              state: 'closed', state_reason: accepted ? 'completed' : 'not_planned'
            });
