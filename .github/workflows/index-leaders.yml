name: index-leaders

# Panic & index leaders paper accounts (index_leaders.py), one buying under 20 and one under 17: shortly before the
# US close the intraday thermometer decides a buy (half the ten largest S&P 500 holdings by weight, half RSP); after
# the close the order is filled, the accounts are marked, and after at least 42 months they sell at the close after
# the first euphoria close. Paper only.
on:
  schedule:
    # GitHub starts scheduled runs late or not at all under load (none of the 23 Nov 2026 runs started), so each
    # step is scheduled several times. Both steps are idempotent: the close run skips sessions already marked,
    # and the last check before the close replaces an earlier one.
    - cron: '41 22 * * 1-5'     # after the US close: fill a pending order at the close, mark, sell
    - cron: '41 23 * * 1-5'
    - cron: '41 1 * * 2-6'
    - cron: '10 19 * * 1-5'     # before the close in summer (EDT): the intraday thermometer decides the buy
    - cron: '25 19 * * 1-5'
    - cron: '40 19 * * 1-5'
    - cron: '10 20 * * 1-5'     # the same in winter (EST); index_leaders.py --decide times itself (window())
    - cron: '25 20 * * 1-5'
    - cron: '40 20 * * 1-5'
    - cron: '30 14 * * 1-5'     # morning reading, about one hour after the open (10:25-11:00 New York): EDT
    - cron: '45 14 * * 1-5'
    - cron: '30 15 * * 1-5'     # the same in winter (EST)
    - cron: '45 15 * * 1-5'
    - cron: '10 16 * * 1-5'     # early 13:00 closes (day after Thanksgiving, 24 Dec, 3 Jul): EDT
    - cron: '25 16 * * 1-5'
    - cron: '10 17 * * 1-5'     # the same in winter (EST); on other days these runs only print 'outside'
    - cron: '25 17 * * 1-5'
    - cron: '40 17 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'close (fill, mark, sell) or check (intraday: morning reading or the pre-close decision, by the time)'
        type: choice
        options: [close, check]
        default: close

permissions:
  contents: write
  actions: write   # republish the pages after the commit

concurrency:
  group: index-leaders
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -r requirements-research.txt
      - name: Advance the account
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          # Only the three after-the-close schedules (and a manual 'close') fill and mark; every other schedule,
          # and a manual 'check', is an intraday check that index_leaders.py --decide times itself.
          case "$SCHEDULE" in
            '41 22 * * 1-5'|'41 23 * * 1-5'|'41 1 * * 2-6') decide=0 ;;
            '') if [ "$MODE" = check ]; then decide=1; else decide=0; fi ;;
            *) decide=1 ;;
          esac
          if [ "$decide" = 1 ]; then
            python index_leaders.py --decide | tee run.json
          else
            python index_leaders.py | tee run.json
          fi
          { echo '### Panic & index leaders'; echo '```json'; cat run.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit and republish
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name  "investorace-bot"
          git config user.email "investorace-bot@users.noreply.github.com"
          git add paper_trades/index-leaders.json paper_trades/index-leaders-17.json paper_trades/index-leaders-17-spcx-ant.json paper_trades/index-leaders-20-move.json index-leaders/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm "index leaders: $(date -u '+%F %H:%M')"
          for attempt in 1 2 3 4 5; do
            if git push -q origin "HEAD:$BRANCH"; then pushed=true; break; fi
            git pull -q --rebase origin "$BRANCH"     # only this workflow writes these two files
            sleep $((attempt * 3))
          done
          test "${pushed:-}" = true
          gh workflow run research-pages.yml --ref "$BRANCH"
