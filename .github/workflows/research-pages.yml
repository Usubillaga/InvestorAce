name: publish-weekly-research

on:
  push:
    branches: [main]
    paths:
      - 'weekly-research/**'
      - 'market-briefings/**'
      - 'daily-briefings/**'
      - 'claude-briefings/**'
      - 'weekly_research.py'
      - '.github/workflows/research-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Share the scoreboard's Pages lock, and read main after any earlier deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate and build research pages
        run: |
          python -m unittest test_weekly_research test_daily_briefing test_claude_briefing test_market_scanner -v
          python weekly_research.py --output public
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
