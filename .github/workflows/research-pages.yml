name: publish-weekly-research

on:
  push:
    branches: [main]
    paths:
      - 'weekly-research/**'
      - 'market-briefings/**'
      - 'daily-briefings/**'
      - 'claude-briefings/**'
      - 'market-scan/**'
      - 'weekly_research.py'
      - 'trading_desk.py'
      - '.github/workflows/research-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write               # delete this run's Pages artifact after deploying

# Share the scoreboard's Pages lock, and read main after any earlier deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Validate and build research pages
        run: |
          python -m unittest test_weekly_research test_daily_briefing test_claude_briefing test_market_scanner -v
          python weekly_research.py --output public
      - uses: actions/configure-pages@v6
      - id: pages_artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        name: Deploy the uploaded Pages artifact
        uses: actions/github-script@v8
        env:
          PAGE_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          script: |
            await require('./.github/scripts/deploy-pages.cjs')({
              github, context, core, artifactId: process.env.PAGE_ARTIFACT_ID
            })
      - name: Delete the Pages artifact once deployed
        # The site artifact (about 64 MB) otherwise counts against the account's
        # Actions storage for its one-day retention, after every deploy.
        if: success()
        continue-on-error: true     # the site is live; a failed cleanup must not mark the deploy red
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: context.runId});
            for (const artifact of data.artifacts.filter(a => a.name === 'github-pages')) {
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
            }
