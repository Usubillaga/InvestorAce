name: backtest

# Runs backtest.py where Yahoo is reachable and commits backtests/latest.{json,md}
# to the branch it ran on. Pushes made with GITHUB_TOKEN start no new workflow runs.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'backtest.py'
      - '.github/workflows/backtest.yml'
  schedule:
    - cron: '17 5 1 * *'        # 1st of each month, on main
  workflow_dispatch:

permissions:
  contents: write
  actions: write                 # dispatch CI for the results commit (GITHUB_TOKEN pushes start no runs)

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -r requirements-research.txt
      - name: Run backtest
        run: |
          python backtest.py
          cat backtests/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "investorace-bot"
          git config user.email "investorace-bot@users.noreply.github.com"
          git add backtests/latest.json backtests/latest.md
          git commit -q -m "backtest: results $(date -u +%F)" || exit 0
          for attempt in 1 2 3 4; do
            if git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH"; then
              gh workflow run test.yml --ref "$BRANCH" || true
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
