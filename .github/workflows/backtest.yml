name: backtest

# Runs backtest.py where Yahoo is reachable and commits backtests/latest.{json,md}
# to the branch it ran on. Pushes made with GITHUB_TOKEN start no new workflow runs.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'backtest.py'
      - 'buffer_attribution.py'
      - 'pairs_backtest.py'
      - 'start_offsets.py'
      - 'index_backtest.py'
      - 'crash_study.py'
      - 'rebound_backtest.py'
      - 'panic_backtest.py'
      - 'panic_history.py'
      - 'credit_followup.py'
      - 'insider_backtest.py'
      - 'mcclellan_backtest.py'
      - '.github/workflows/backtest.yml'
  schedule:
    - cron: '17 5 1 * *'        # 1st of each month, on main
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write
  actions: write                 # dispatch CI for the results commit (GITHUB_TOKEN pushes start no runs)

# One run per branch at a time. A run that is triggered while another is running waits for it,
# then starts from the branch's newest commit (including the first run's results), so its own
# results push is a fast-forward instead of a rejected race. GitHub keeps one waiting run per
# group: a third trigger replaces the waiting one (shown as cancelled), which is harmless
# because the run that remains starts from the newest commit anyway.
concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}   # the branch head when this run starts, not when it was queued
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -r requirements-research.txt
      - name: Day of the price panel
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore the day's price panel
        # Runs on the same day reuse one Yahoo download, so their results are comparable.
        uses: actions/cache@v4
        with:
          path: .cache/backtest-prices.pkl
          key: backtest-prices-${{ steps.day.outputs.day }}-${{ hashFiles('engine.py') }}
      - name: Run backtest
        env:
          BACKTEST_PRICE_CACHE: .cache/backtest-prices.pkl
        run: |
          python backtest.py
          cat backtests/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Drawdown and rebound study (crash_study.py)
        # Optional: a failure keeps the previous crash_study.json and never blocks the backtest results.
        continue-on-error: true
        run: python crash_study.py
      - name: Credit spreads from FRED (for panic_history.py)
        # Optional: curl with retries; panic_history.py reads these files and records in its results why a series is missing.
        continue-on-error: true
        run: |
          mkdir -p .cache
          for id in BAMLH0A0HYM2 BAA10Y; do
            curl -sSL --retry 4 --retry-delay 10 --max-time 120 -A 'Mozilla/5.0 (InvestorAce research)' \
              -o ".cache/fred-$id.csv" -w "$id: HTTP %{http_code}, %{size_download} bytes\n" \
              "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$id" || echo "$id: curl failed"
            head -c 120 ".cache/fred-$id.csv" 2>/dev/null; echo
          done
      - name: Panic buys since 2000 (panic_history.py)
        # Optional, like the crash study: a failure keeps the previous results and never blocks the backtest.
        continue-on-error: true
        timeout-minutes: 45              # chunked download with pauses while Yahoo throttles
        run: python panic_history.py
      - name: Credit stress follow-up (credit_followup.py)
        # Optional: S&P 500 index and the FRED file above; a failure keeps the previous results.
        continue-on-error: true
        timeout-minutes: 15
        run: python credit_followup.py
      - name: Insider purchase clusters since 2006 (insider_backtest.py)
        # Optional as well: SEC data sets and Yahoo prices; a failure keeps the previous results.
        continue-on-error: true
        timeout-minutes: 50
        run: python insider_backtest.py
      - name: McClellan breadth thrust from S&P 500 members (mcclellan_backtest.py)
        continue-on-error: true
        timeout-minutes: 30
        run: python mcclellan_backtest.py
      - name: Commit results
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "investorace-bot"
          git config user.email "investorace-bot@users.noreply.github.com"
          tested=$(git rev-parse HEAD)   # the commit these results were calculated from
          git add backtests/latest.json backtests/latest.md
          if [ -f backtests/crash_study.json ]; then git add backtests/crash_study.json; fi
          for f in backtests/panic_history.json backtests/panic_history.md backtests/credit_followup.json backtests/credit_followup.md backtests/insider_clusters.json backtests/insider_clusters.md backtests/mcclellan.json backtests/mcclellan.md; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm "backtest: results $(date -u +%F)"
          target="$BRANCH"
          if [[ "$BRANCH" == main ]]; then
            target="bot/backtest-${GITHUB_RUN_ID}"
          fi
          # Never rebase computed results onto source code they did not test.
          # A concurrent update rejects the push and leaves the previous report intact.
          if [[ "$BRANCH" == main ]] && git ls-remote --exit-code origin "refs/heads/$target" >/dev/null; then
            git fetch --no-tags origin "$target"
            test "$(git rev-parse FETCH_HEAD^)" = "$tested"
            # Retry publication of the already pushed result from this run.
          else
            git push origin "HEAD:refs/heads/$target"
          fi
          if [[ "$BRANCH" == main ]]; then
            if ! gh pr view "$target" --json url >/dev/null 2>&1; then
              gh pr create --base main --head "$target" --title "Monthly backtest results" \
                --body "Results calculated from $tested by workflow run $GITHUB_RUN_ID."
            fi
          fi
          gh workflow run test.yml --ref "$target"
