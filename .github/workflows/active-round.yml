name: active-round

# Daily trading round of the active paper account (Claude's rules, active_rules.py), run here instead
# of in a chat session since 21 Nov 2026. Decisions use the last committed build (previous close);
# each order becomes an issue (the audit trail) and is recorded with active_trading.py intake, the
# same code paper-order.yml uses. Issues opened with GITHUB_TOKEN start no workflow and are not the
# owner's, so paper-order.yml never records them a second time. Paper only.
on:
  schedule:
    - cron: '43 12 * * 1-5'     # 12:43 UTC: after the nightly build, before the 19:30 UTC fill cut-off
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write  # publish the updated paper journal after a bot commit

concurrency:
  group: active-round
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -r requirements-research.txt

      - name: Plan
        id: plan
        run: |
          python active_round.py plan > plan.json
          cat plan.json
          {
            echo '### Active trading round'
            echo '```json'
            cat plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open and record each order
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name  "investorace-bot"
          git config user.email "investorace-bot@users.noreply.github.com"
          count=$(python -c "import json; p=json.load(open('plan.json')); print(0 if 'skip' in p else len(p['titles']))")
          echo "orders: $count"
          today=$(date -u +%F)
          recorded=false
          # A previous attempt can stop after its push and before its issue is closed.
          # Pending orders are absent from a freshly generated plan.
          recorded_ids=$(jq -r --arg day "$today" '.orders[]? |
            (select(.submitted_at | startswith($day)) | .id),
            (select((.cancelled_at // "") | startswith($day)) | .cancelled_by)' paper_trades/active-account.json)
          for number in $recorded_ids; do
            recorded=true
            issue=$(gh api "repos/$REPO/issues/$number")
            if jq -e '.state == "open" and .user.login == "github-actions[bot]"' <<< "$issue" >/dev/null; then
              gh issue close "$number" --repo "$REPO" --reason completed
            fi
          done
          for i in $(seq 0 $((count - 1))); do
            title=$(python -c "import json,sys; print(json.load(open('plan.json'))['titles'][$i])")
            python -c "import json; print(json.load(open('plan.json'))['bodies'][$i])" > body.txt
            printf '\n\n---\n_Opened by the active-round workflow (rules in active_rules.py)._\n' >> body.txt
            # One order per title and day, also across a re-run of this workflow.
            existing=$(gh api --paginate --method GET "repos/$REPO/issues" -f state=all -f since="${today}T00:00:00Z" -F per_page=100 |
              jq -sr --arg title "$title" --arg day "$today" '[.[][] | select(.title == $title and (.created_at | startswith($day)) and (.pull_request == null) and (.author_association == "OWNER" or .user.login == "github-actions[bot]"))] | sort_by(.number) | first // empty | [.number,.state,.user.login] | @tsv')
            if [ -n "$existing" ]; then
              IFS=$'\t' read -r number state author <<< "$existing"
              if [[ "$state" != open || "$author" != 'github-actions[bot]' ]]; then continue; fi
              gh api "repos/$REPO/issues/$number" --jq .body > body.txt
            else
              url=$(gh issue create --repo "$REPO" --title "$title" --body-file body.txt)
              number=${url##*/}
            fi
            created=$(gh api "repos/$REPO/issues/$number" --jq .created_at)
            result=""
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch -q origin "$BRANCH"
              git reset -q --hard "origin/$BRANCH"
              if jq -e --argjson id "$number" 'any(.orders[]?; .id == $id or .cancelled_by == $id)' paper_trades/active-account.json >/dev/null; then
                result="ACCEPTED: Already recorded in the ledger."
                break
              fi
              result="$(ORDER_TITLE="$title" ORDER_BODY="$(cat body.txt)" ORDER_ISSUE="$number" \
                        ORDER_CREATED_AT="$created" GITHUB_OUTPUT= python active_trading.py intake | tail -n 1)"
              case "$result" in
                ACCEPTED:*)
                  git add paper_trades/active-account.json
                  git commit -q -m "paper order #$number (active-round)"
                  if git push -q origin "HEAD:$BRANCH"; then break; fi
                  result="" ;;
                REJECTED:*) break ;;
                *) echo "Unexpected intake response" >&2; exit 1 ;;
              esac
              sleep $((attempt * 3))
            done
            echo "#$number $title -> ${result:-could not push}"
            echo "- #$number \`$title\`: ${result:-could not push after 8 attempts}" >> "$GITHUB_STEP_SUMMARY"
            case "$result" in
              ACCEPTED:*) recorded=true
                          gh issue comment "$number" --repo "$REPO" --body "✅ ${result#ACCEPTED: }"
                          gh issue close "$number" --repo "$REPO" --reason completed ;;
              REJECTED:*) gh issue comment "$number" --repo "$REPO" --body "❌ ${result:-could not push the order; see the workflow log}"
                 gh issue close "$number" --repo "$REPO" --reason "not planned" ;;
              *) echo "Ledger push failed for issue #$number" >&2; exit 1 ;;
            esac
          done
          if [ "$recorded" = true ]; then
            gh workflow run research-pages.yml --ref "$BRANCH" --repo "$REPO"
          fi
