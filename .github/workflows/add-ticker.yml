# .github/workflows/add-ticker.yml
# Two ways in, one job:
#   1. Actions -> Run workflow -> type a ticker         (workflow_dispatch)
#   2. New issue titled  "add-ticker: MSFT"             (issues)
# Both run add_ticker.py -> autoscore -> commit -> rebuild -> deploy.

name: Add ticker
run-name: >-
  Add ${{ inputs.ticker || github.event.issue.title || 'ticker' }}

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Yahoo ticker, e.g. MSFT or ASML.AS'
        required: true
        type: string
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: scoreboard
  cancel-in-progress: false

jobs:
  add:
    # A manual run has NO github.event.issue, so a title-only gate evaluates to
    # startsWith(null, ...) = false and the job shows "skipped" before doing
    # anything. Both clauses are required.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, 'add-ticker:')
    runs-on: ubuntu-latest
    timeout-minutes: 15            # a hung yfinance call must not run for hours

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip               # ~30s faster per run

      - run: pip install -r requirements.txt

      - name: Parse ticker
        id: parse
        run: |
          RAW="${{ inputs.ticker || github.event.issue.title }}"
          T=$(echo "$RAW" | sed 's/^[Aa]dd-ticker:[[:space:]]*//' \
                          | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          if [ -z "$T" ]; then
            echo "::error::No ticker found in '$RAW'"
            exit 1
          fi
          echo "ticker=$T" >> $GITHUB_OUTPUT
          echo "### Adding \`$T\`" >> $GITHUB_STEP_SUMMARY

      - name: Add and score
        id: add
        run: |
          set +e
          python add_ticker.py "${{ steps.parse.outputs.ticker }}" 2>&1 | tee result.txt
          CODE=${PIPESTATUS[0]}
          set -e
          if grep -q "already in DATA" result.txt; then
            echo "status=exists" >> $GITHUB_OUTPUT
          elif [ "$CODE" -eq 0 ]; then
            echo "status=added"  >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
          {
            echo '```'
            cat result.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Stop if nothing was added
        if: steps.add.outputs.status != 'added'
        run: |
          echo "::notice::${{ steps.parse.outputs.ticker }} -> ${{ steps.add.outputs.status }}, nothing to deploy"

      - name: Rebuild scoreboard
        if: steps.add.outputs.status == 'added'
        run: python engine.py

      - name: Commit
        if: steps.add.outputs.status == 'added'
        run: |
          git config user.name  "investorace-bot"
          git config user.email "actions@github.com"
          git add -A engine.py index.html history/
          if git diff --staged --quiet; then
            echo "::notice::no file changes to commit"
          else
            git commit -m "add ${{ steps.parse.outputs.ticker }}"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push
          fi

      - name: Stage site
        if: steps.add.outputs.status == 'added'
        run: |
          mkdir -p public
          cp index.html public/
          cp tickers.js public/ 2>/dev/null || true
          cp -r history  public/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        if: steps.add.outputs.status == 'added'
        with:
          path: public

      - uses: actions/deploy-pages@v4
        if: steps.add.outputs.status == 'added'

      - name: Comment on the issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let out = '(no output captured)';
            try { out = fs.readFileSync('result.txt', 'utf8'); } catch (e) {}
            const s = '${{ steps.add.outputs.status }}';
            const head = s === 'added'  ? '### Added and deployed'
                       : s === 'exists' ? '### Already in the model'
                       :                  '### Failed';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: head + '\n\n```\n' + out.slice(0, 60000) + '\n```'
            });
            if (s === 'added' || s === 'exists') {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, state: 'closed'
              });
            }
