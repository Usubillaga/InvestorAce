name: add-ticker

# Triggered by an issue titled  add-ticker: MSFT
# The gate is TITLE-based: labels are silently dropped on issues opened by
# some clients, so a label gate skips runs with no visible reason.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker symbol'
        required: true

permissions:
  contents: write
  issues: write

jobs:
  add:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, 'add-ticker:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Resolve ticker
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sym=${{ github.event.inputs.ticker }}" >> $GITHUB_OUTPUT
          else
            echo "sym=$(echo '${{ github.event.issue.title }}' | sed 's/add-ticker://' | tr -d ' ')" >> $GITHUB_OUTPUT
          fi

      - name: Add and verify
        run: |
          python add_ticker.py "${{ steps.t.outputs.sym }}"
          python -c "import ast;ast.parse(open('engine.py').read())"
          python engine.py

      - name: Commit
        run: |
          git config user.name  "investorace-bot"
          git config user.email "investorace-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "add ${{ steps.t.outputs.sym }}"
          git push

      - name: Report
        if: github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
              body: 'Added `${{ steps.t.outputs.sym }}` and rebuilt. Deploy runs on the next schedule, or trigger build-and-deploy manually.'

            })
